# Ship: runs on every push and pull request (and weekly, to catch newly published CVEs).
# Build & test on Windows + Linux, then the full Security Scan.
name: Ship

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: ship-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Plain per-OS jobs sharing steps via a YAML anchor, so no "Matrix" group shows on the run page.
  build-test-linux:
    name: Build & test on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps: &build-test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI (typecheck + bundle)
        working-directory: web
        run: |
          npm ci --ignore-scripts --no-fund
          npm run build
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./internal/...
      - name: go build
        run: go build -trimpath ./...

  build-test-windows:
    name: Build & test on Windows
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps: *build-test-steps

  security:
    name: Security
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml

  dependency-review:
    name: Dependency review (PRs)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Block PRs that add vulnerable dependencies
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
